[package]
name = "fountgen-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A CLI tool for randomly generating fountain screenplay scripts."
repository = "https://github.com/frblo/fountgen"
keywords = ["fountain", "screenplay", "stageplay"]
categories  = ["command-line-interface", "command-line-utilities", "development-tools::testing"]

[[bin]]
name = "fountgen"
path = "src/main.rs"
doc = false

[dependencies]
fountgen = { version = "0.1.0", path = "../fountgen" }
clap = { version = "4.6", features = ["derive"]}
color-eyre = "0.6.5"
